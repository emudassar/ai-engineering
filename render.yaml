# Render Blueprint: deploys local-biz-bot as a free web service.
# Secrets marked sync: false are typed into the Render dashboard, never committed.
services:
  - type: web
    name: local-biz-bot
    runtime: python
    plan: free
    rootDir: local-biz-bot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

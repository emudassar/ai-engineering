[project]
name = "hiremeai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M Mudassar", email = "contacmudassar@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hiremeai = "hiremeai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
